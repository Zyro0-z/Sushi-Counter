<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sushi">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--ARTIFACT-START-->
<title>Contador de Sushi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: iOS tab app. Cada pestaña es una vista con barra de navegación translúcida + título grande; hojas modales desde abajo. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --sheet:#F2F2F7; --sheet-card:#FFFFFF; --seg-th:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --bar:rgba(246,246,248,.78); --tab:rgba(249,249,251,.84);
  --rim:rgba(0,0,0,.07); --shd:rgba(30,20,10,.13); --medal-off:#D6D6DC;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(40,30,20,.06);
  --green:#34C759; --red:#FF3B30; --gold:#FFB800;
  --accent:#FA5D3C;
  --accent-soft:color-mix(in srgb,var(--accent) 14%,transparent);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --sheet:#1C1C1E; --sheet-card:#2C2C2E; --seg-th:#636366;
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.28);
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --bar:rgba(20,20,22,.76); --tab:rgba(22,22,24,.84);
    --rim:rgba(255,255,255,.2); --shd:rgba(0,0,0,.55); --medal-off:#3A3A3C;
    --shadow:none; --green:#30D158; --red:#FF453A; --gold:#FFD60A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --sheet:#1C1C1E; --sheet-card:#2C2C2E; --seg-th:#636366;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.28);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --bar:rgba(20,20,22,.76); --tab:rgba(22,22,24,.84);
  --rim:rgba(255,255,255,.2); --shd:rgba(0,0,0,.55); --medal-off:#3A3A3C;
  --shadow:none; --green:#30D158; --red:#FF453A; --gold:#FFD60A;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.41px;overflow:hidden;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;letter-spacing:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
svg{display:block}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:0}

/* ---------- Estructura ---------- */
.app{position:fixed;inset:0;background:#000}
.stage{position:absolute;inset:0;background:var(--bg);transform-origin:50% 0;transition:transform .5s var(--spring),border-radius .5s var(--spring),filter .5s;overflow:hidden}
body.sheet-open .stage{transform:translateY(calc(var(--st) + 8px)) scale(.94);border-radius:14px;filter:brightness(.92)}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(96px + var(--sb))}
.view.enter{animation:viewIn .42s var(--spring)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.nav{position:sticky;top:0;z-index:20;padding-top:var(--st);transition:background-color .25s,box-shadow .25s}
.nav.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--sep)}
.nav-in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-left:var(--gl);padding-right:var(--gr)}
.nav-t{font-weight:600;font-size:17px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .25s var(--spring);white-space:nowrap}
.nav.scrolled .nav-t{opacity:1;transform:none}
.nav-l{justify-self:start;display:flex;gap:6px}.nav-r{justify-self:end;display:flex;gap:6px}
.nb{border:0;background:none;color:var(--accent);font-size:17px;padding:8px 2px;display:inline-flex;align-items:center;gap:5px;transition:opacity .2s,color .2s}
.nb.b{font-weight:600}
.nb:active{opacity:.4}
.nb:disabled{color:var(--label3)}
.nb svg{width:23px;height:23px}
.ib{width:36px;height:36px;border-radius:50%;justify-content:center;padding:0;background:var(--fill)}
.ib svg{width:19px;height:19px}
.content{padding-left:var(--gl);padding-right:var(--gr);max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lt-wrap{padding-top:2px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0;text-wrap:balance}
.lt-sub{margin:2px 0 0;color:var(--label2);font-size:15px;letter-spacing:-.24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:10px 4px -4px}
.sec-h h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.35px}
.sec-a{color:var(--label2);font-size:13px;letter-spacing:-.08px}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow)}

/* ---------- Comensales ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 4px var(--gl);scroll-padding-left:var(--gl)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:5px 12px 5px 5px;background:var(--card);box-shadow:var(--shadow);transition:background-color .35s var(--spring),color .35s,transform .3s var(--bounce);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip:active{transform:scale(.95)}
.chip .av{width:28px;height:28px;font-size:13px}
.chip-n{font-weight:600;font-size:15px;letter-spacing:-.24px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-c{font-family:var(--round);font-weight:800;font-size:13px;min-width:22px;padding:2px 6px;border-radius:99px;background:var(--fill);text-align:center;font-variant-numeric:tabular-nums;transition:background-color .35s}
.chip.on{background:var(--c);color:#fff}
.chip.on .chip-c{background:rgba(255,255,255,.25)}
.chip.on .av{background:#fff;color:var(--c)}
.chip.add{padding:0;width:38px;height:38px;justify-content:center;color:var(--accent)}
.chip.add svg{width:20px;height:20px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font-family:var(--round);font-weight:900;flex:0 0 auto;transition:background-color .35s,color .35s}
.av.xl{width:84px;height:84px;font-size:38px;box-shadow:0 10px 30px color-mix(in srgb,var(--c) 40%,transparent)}
.av.md{width:34px;height:34px;font-size:15px}

/* ---------- Héroe ---------- */
.hero{padding:18px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:16px}
.ring-btn{border:0;background:none;padding:0;position:relative;width:min(220px,62vw);aspect-ratio:1;max-width:100%;border-radius:50%;-webkit-user-select:none;user-select:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:15}
.ring-track{stroke:var(--fill)}
.ring-bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .9s var(--spring),stroke .5s}
.ring-bar.full{stroke:url(#g-goldring)}
.ring-glow{fill:none;stroke-width:15;stroke:var(--accent);opacity:0;filter:blur(8px)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-k{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:5px}
.ring-k i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--accent))}
.ring-n{font-size:clamp(52px,17vw,72px);font-weight:900;line-height:1}
.ring-s{font-size:14px;color:var(--label2);letter-spacing:-.15px}
.ring-btn.bump .ring-n{animation:bump .45s var(--bounce)}
@keyframes bump{40%{transform:scale(1.08)}}
.stats{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;border-radius:14px;background:var(--fill);min-width:0}
.stat-l{font-size:11px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.stat-v{font-family:var(--round);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.amort{width:100%;display:flex;flex-direction:column;gap:7px}
.amort-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.4px}
.amort-top b{color:var(--label);font-family:var(--round);font-weight:800;letter-spacing:0}
.amort-t{margin:0;font-size:15px;letter-spacing:-.24px;color:var(--label)}
.amort-t.ok{color:var(--green)}
.meter{position:relative;height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--accent);transition:width .8s var(--spring),background-color .4s;transform-origin:left}
.meter.ok i{background:var(--green)}
.meter.sm{height:6px}
.meter.anim i{animation:grow .9s var(--spring)}
@keyframes grow{from{transform:scaleX(0)}}

/* ---------- Piezas ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:740px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;gap:2px 8px;padding:14px 14px 12px;min-height:138px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .45s var(--bounce),box-shadow .3s;isolation:isolate}
.pc:active{transform:scale(.955);transition-duration:.12s}
.pc-ic{grid-row:1;grid-column:1;width:58px;height:58px;margin:-4px 0 0 -4px}
.pc-ic svg{width:100%;height:100%;overflow:visible}
.pc-n{grid-row:1;grid-column:2;justify-self:end;font-size:34px;font-weight:900;line-height:1;color:var(--label);transition:color .3s}
.pc.zero .pc-n{color:var(--label3)}
.pc-txt{grid-row:3;grid-column:1/3;display:flex;flex-direction:column;gap:1px;padding-right:40px;min-width:0}
.pc-name{font-weight:600;font-size:16px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-meta{font-size:12px;color:var(--label2);letter-spacing:0}
.pc-minus{position:absolute;right:10px;bottom:10px;width:32px;height:32px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--fill);color:var(--label2);transition:transform .4s var(--bounce),opacity .25s;z-index:2}
.pc-minus svg{width:16px;height:16px}
.pc-minus:active{transform:scale(.85);background:var(--fill2)}
.pc.zero .pc-minus{transform:scale(.4);opacity:0;pointer-events:none}
.pc-plus{display:none}
.rip{position:absolute;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:-1}
.plus1{position:absolute;pointer-events:none;font-family:var(--round);font-weight:900;font-size:22px;color:var(--accent);z-index:3;margin:-14px 0 0 -14px}
.grid.list{grid-template-columns:minmax(0,1fr);gap:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.grid.list .pc{display:flex;align-items:center;gap:12px;min-height:0;padding:8px 12px 8px 12px;border-radius:0;box-shadow:none;background:none}
.grid.list .pc+.pc::before{content:"";position:absolute;top:0;left:72px;right:0;height:.5px;background:var(--sep)}
.grid.list .pc:active{transform:none;background:var(--fill)}
.grid.list .pc-ic{width:48px;height:48px;margin:0}
.grid.list .pc-txt{order:2;flex:1;padding:0}
.grid.list .pc-n{order:3;font-size:26px}
.grid.list .pc-minus{order:4;position:static}
.grid.list .pc-plus{order:5;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff}
.grid.list .pc-plus svg{width:16px;height:16px}
.grid.list .pc.zero .pc-minus{transform:scale(.4)}

/* ---------- Filas / listas agrupadas ---------- */
.gsec{display:flex;flex-direction:column}
.glabel{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;margin:12px 16px 7px}
.gfoot{font-size:13px;color:var(--label2);letter-spacing:-.08px;margin:7px 16px 0;line-height:1.35}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.sheet .group{background:var(--sheet-card)}
.group.pad{padding:14px 16px}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:6px 16px;border:0;background:none;text-align:left;color:var(--label);font-size:17px}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--ins,16px);height:.5px;background:var(--sep)}
button.row:active,.row.tap:active{background:var(--fill)}
.row-l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-v{color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row-in{flex:1;min-width:0;border:0;background:none;color:var(--label2);font:inherit;letter-spacing:inherit;text-align:right;padding:8px 0;outline:none}
.row-in:focus{color:var(--label)}
.row .chev{width:14px;height:14px;color:var(--label3);flex:0 0 auto}
.row.danger{color:var(--red);justify-content:center}
.row.accent{color:var(--accent)}
.row.armed{background:color-mix(in srgb,var(--red) 12%,transparent);font-weight:600}
.row .ricon{width:34px;height:34px;flex:0 0 auto}
.row .ricon svg{width:100%;height:100%}
.sub{display:block;font-size:13px;color:var(--label2);letter-spacing:-.08px}

/* Interruptor iOS */
.sw{position:relative;flex:0 0 auto;width:51px;height:31px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--fill2);transition:background-color .3s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .35s var(--spring),width .2s}
.sw input:checked+span{background:var(--green)}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:active+span::after{width:32px}
.sw input:checked:active+span::after{transform:translateX(15px)}
.sw input:focus-visible+span{outline:2.5px solid var(--accent);outline-offset:2px}

/* Control segmentado */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--fill);border-radius:9px;padding:2px;width:100%}
.seg button{position:relative;z-index:1;border:0;background:none;font-size:13px;font-weight:500;letter-spacing:-.08px;padding:7px 4px;color:var(--label);transition:font-weight .2s;white-space:nowrap}
.seg button[aria-pressed="true"]{font-weight:600}
.seg-th{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));transform:translateX(calc(100% * var(--i)));background:var(--seg-th);border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .4s var(--spring)}

/* Stepper */
.stepper{display:flex;flex:0 0 auto;background:var(--fill);border-radius:8px;overflow:hidden}
.stepper button{width:46px;height:32px;border:0;background:none;display:grid;place-items:center;color:var(--label)}
.stepper button:active{background:var(--fill2)}
.stepper button svg{width:17px;height:17px}
.stepper i{width:1px;margin:7px 0;background:var(--sep)}

/* Muestras de color */
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.swc{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);position:relative;transition:transform .3s var(--bounce)}
.swc::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2.5px solid var(--c);opacity:0;transform:scale(.8);transition:opacity .2s,transform .3s var(--bounce)}
.swc.on::after{opacity:1;transform:none}
.swc:active{transform:scale(.88)}

/* ---------- Desafíos ---------- */
.sum{padding:18px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.sum-n{font-family:var(--round);font-weight:900;font-size:46px;line-height:1;letter-spacing:0;grid-row:1/3}
.sum-n span{font-size:22px;color:var(--label3)}
.sum-t{font-weight:600;font-size:15px;letter-spacing:-.24px}
.sum .meter{grid-column:2}
.sum-medals{grid-column:1/3;display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.sum-medals svg{width:30px;height:30px}
.ch-row{--ins:78px;align-items:flex-start;padding:12px 16px;gap:14px}
.ch-row .medal{width:48px;height:48px;flex:0 0 auto}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row-t{font-weight:600;font-size:16px;letter-spacing:-.3px;display:flex;align-items:center;gap:6px}
.row-d{font-size:13px;color:var(--label2);letter-spacing:-.08px}
.row-p{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums;letter-spacing:0}
.row-ok{font-size:13px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:4px}
.row-ok svg{width:14px;height:14px}
.ch-row .meter{margin-top:5px}
.tag{font-style:normal;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);letter-spacing:.2px}
.cnt{font-family:var(--round);font-weight:800;font-size:13px;color:var(--label2);align-self:center;font-variant-numeric:tabular-nums}
.medal.locked .mg{opacity:.5}
.medal.locked .mi{filter:grayscale(1);opacity:.55}
.ch-row.fresh .medal{animation:medalIn .9s var(--bounce)}
@keyframes medalIn{0%{transform:scale(.3) rotate(-30deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:none}}
.duel{padding:16px;display:flex;flex-direction:column;gap:12px}
.duel h3,.chart-card h3{margin:0;font-size:15px;font-weight:600;color:var(--label2);letter-spacing:-.24px;display:flex;justify-content:space-between}
.dl{display:grid;grid-template-columns:20px 34px 1fr auto;gap:10px;align-items:center}
.dl-pos{font-family:var(--round);font-weight:900;color:var(--label3);text-align:center}
.dl-pos.p1{color:var(--gold)}
.dl-main{display:flex;flex-direction:column;gap:5px;min-width:0}
.dl-name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden}
.dl-bar i{display:block;height:100%;border-radius:inherit;background:var(--c);animation:grow 1s var(--spring);transform-origin:left}
.dl-n{font-family:var(--round);font-weight:900;font-size:20px;font-variant-numeric:tabular-nums}
.next{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;text-align:left;width:100%;transition:transform .4s var(--bounce)}
.next:active{transform:scale(.98)}
.next .medal{width:46px;height:46px;flex:0 0 auto}
.next .chev{width:14px;height:14px;color:var(--label3)}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--accent)}

/* ---------- Historial ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{background:var(--card);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);min-width:0}
.tile b{font-family:var(--round);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums;letter-spacing:0}
.tile span{font-size:11px;color:var(--label2);text-transform:uppercase;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.chart-card{padding:16px 14px 10px}
.chart{width:100%;height:auto;margin-top:8px;overflow:visible}
.chart .gl{stroke:var(--sep);stroke-width:1}
.chart .tx{fill:var(--label2);font:500 10px var(--font);letter-spacing:0}
.chart .tv{fill:var(--label);font:800 11px var(--round);letter-spacing:0}
.chart .bar{fill:var(--fill2);transform-box:fill-box;transform-origin:50% 100%;animation:barUp .9s var(--spring) both}
.chart .bar.cur{fill:var(--accent)}
@keyframes barUp{from{transform:scaleY(0)}}
.h-row{--ins:16px;padding:10px 16px}
.h-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:48px;border-radius:12px;background:var(--fill);flex:0 0 auto}
.h-date b{font-family:var(--round);font-weight:900;font-size:19px;line-height:1}
.h-date span{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--accent);letter-spacing:.4px}
.h-av{display:flex}
.h-av .av{width:20px;height:20px;font-size:10px;border:2px solid var(--card);margin-left:-6px}
.h-av .av:first-child{margin-left:0}
.h-tot{font-family:var(--round);font-weight:900;font-size:22px;font-variant-numeric:tabular-nums}
.empty{padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:var(--label2);font-size:15px}
.empty svg{width:92px;height:92px;margin-bottom:6px}
.empty b{color:var(--label);font-size:17px}

/* ---------- Barra de pestañas ---------- */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);padding:6px var(--gr) calc(var(--sb) + 4px) var(--gl);background:var(--tab);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 -.5px 0 var(--sep)}
.tb{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0 4px;color:var(--label3);font-size:10px;font-weight:500;letter-spacing:.1px;transition:color .25s}
.tb svg{width:27px;height:27px;transition:transform .45s var(--bounce)}
.tb[aria-selected="true"]{color:var(--accent)}
.tb[aria-selected="true"] svg{transform:scale(1.06)}
.tb:active svg{transform:scale(.85)}
.tb .fillsel{fill:currentColor;opacity:0;transition:opacity .25s}
.tb[aria-selected="true"] .fillsel{opacity:.18}
.badge{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font:700 12px/18px var(--font);text-align:center;letter-spacing:0;animation:badgeIn .5s var(--bounce)}
@keyframes badgeIn{from{transform:scale(0)}}

/* ---------- Hoja modal ---------- */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.32);opacity:0;transition:opacity .45s}
body.sheet-open .backdrop{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:600px;z-index:41;max-height:calc(100% - var(--st) - 18px);background:var(--sheet);border-radius:14px 14px 0 0;transform:translateY(105%);transition:transform .5s var(--spring);overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--sb) + 20px);box-shadow:0 -10px 40px rgba(0,0,0,.18)}
body.sheet-open .sheet{transform:translateY(0)}
.sh-grab{position:sticky;top:0;height:0;z-index:3}
.sh-grab::after{content:"";position:absolute;left:50%;top:6px;width:36px;height:5px;margin-left:-18px;border-radius:99px;background:var(--label3)}
.sh-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding:8px var(--gr) 0 var(--gl);background:var(--sheet);touch-action:none}
.sh-head h3{margin:0;font-size:17px;font-weight:600;text-align:center}
.sh-head .nb:last-child{justify-self:end}
.sh-body{padding:4px var(--gr) 0 var(--gl);display:flex;flex-direction:column;gap:12px}
.sh-hero{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 4px;text-align:center}
.sh-hero h4{margin:4px 0 0;font-size:22px;font-weight:700;letter-spacing:.35px;text-wrap:balance}
.sh-hero p{margin:0;color:var(--label2);font-size:15px;max-width:34ch}
.sh-hero .medal{width:96px;height:96px}
.big{font-family:var(--round);font-weight:900;font-size:64px;line-height:1;letter-spacing:0}
.btn{border:0;border-radius:14px;padding:15px 18px;font-weight:600;font-size:17px;background:var(--accent);color:#fff;width:100%;transition:transform .35s var(--bounce),opacity .2s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.ghost{background:var(--fill);color:var(--red)}
.btn.ghost.armed{background:var(--red);color:#fff}
.picks{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.picks::-webkit-scrollbar{display:none}
.pick{flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border-radius:14px;border:2px solid transparent;background:var(--fill);font-size:11px;font-weight:600;transition:border-color .2s,background-color .2s,transform .3s var(--bounce)}
.pick svg{width:38px;height:38px}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick:active{transform:scale(.93)}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.mini{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:var(--fill);font-size:11px;color:var(--label2)}
.mini svg{width:34px;height:34px}
.mini b{font-family:var(--round);font-weight:900;font-size:17px;color:var(--label)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--sheet-card);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:12px;color:var(--label2);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kv b{font-family:var(--round);font-weight:800;font-size:19px;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.kv b svg{width:26px;height:26px;flex:0 0 auto}

/* ---------- Avisos ---------- */
.banner{position:fixed;left:0;right:0;top:0;z-index:60;margin:0 auto;max-width:440px;padding:calc(var(--st) + 8px) var(--gr) 0 var(--gl);transform:translateY(-140%);transition:transform .6s var(--spring);pointer-events:none}
.banner.show{transform:none;pointer-events:auto}
.bn{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(26px);backdrop-filter:saturate(180%) blur(26px);box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 .5px var(--sep);border:0;width:100%;text-align:left}
.bn .medal{width:44px;height:44px;flex:0 0 auto}
.bn-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.bn-t small{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.4px}
.bn-t b{font-size:16px;font-weight:600}
.bn-t span{font-size:13px;color:var(--label2)}
.hud{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);z-index:55;transform:translate(-50%,20px) scale(.9);opacity:0;padding:10px 16px;border-radius:99px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 8px 30px rgba(0,0,0,.16),0 0 0 .5px var(--sep);font-size:15px;font-weight:600;white-space:nowrap;transition:transform .45s var(--spring),opacity .3s;pointer-events:none}
.hud.show{transform:translate(-50%,0);opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* Odómetro */
.odo{display:inline-flex;height:1em;line-height:1;overflow:hidden;font-variant-numeric:tabular-nums}
.odo-c{display:block;height:1em;overflow:hidden}
.odo-s{display:flex;flex-direction:column;transition:transform .7s cubic-bezier(.2,.9,.25,1.08)}
.odo-s span{display:block;height:1em;text-align:center}

.shd{fill:var(--shd)}
.rim{stroke:var(--rim);stroke-width:1}
.mono{stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

const stepper = id => `<div class="stepper" data-stepper="${id}"><button data-dir="-1" aria-label="Menos">${ui('minus')}</button><i></i><button data-dir="1" aria-label="Más">${ui('plus')}</button></div>`;
function bindStepper(root, id, fn) {
  const box = root.querySelector(`[data-stepper="${id}"]`); if (!box) return;
  box.querySelectorAll('button').forEach(b => {
    let t1, t2;
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    b.addEventListener('pointerdown', e => {
      e.preventDefault(); const dir = +b.dataset.dir; fn(dir); feedback('tick');
      t1 = setTimeout(() => { t2 = setInterval(() => fn(dir), 70); }, 420);

    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(+b.dataset.dir); } });
  });
}

function twoStep(btn, label, fn) {
  let armed = false, t;
  const old = btn.textContent;
  btn.addEventListener('click', () => {
    if (armed) { clearTimeout(t); fn(); return; }
    armed = true; btn.textContent = label; btn.classList.add('armed'); feedback('tick');
    t = setTimeout(() => { armed = false; btn.textContent = old; btn.classList.remove('armed'); }, 3000);
  });
}

let sheetOpen = null, sheetCloseT;
function openSheet(o) {
  const sh = $('#sheet'), bd = $('#backdrop');

  sh.setAttribute('aria-label', o.title);

  document.body.classList.add('sheet-open');
  sheetOpen = o;
  $('[data-x]', sh).onclick = closeSheet;

function closeSheet() {
  const sh = $('#sheet');
  document.body.classList.remove('sheet-open'); sh.style.transform = ''; sheetOpen = null;

}
(function dragToDismiss() {
  const sh = $('#sheet'); let y0 = null, dy = 0, t0 = 0;
  sh.addEventListener('pointerdown', e => {
    if (!e.target.closest('.sh-head') || e.target.closest('button')) return;
    y0 = e.clientY; dy = 0; t0 = performance.now(); sh.style.transition = 'none'; sh.setPointerCapture(e.pointerId);
  });
  sh.addEventListener('pointermove', e => {
    if (y0 === null) return;
    dy = e.clientY - y0; sh.style.transform = `translateY(${dy > 0 ? dy : dy / 6}px)`;
  });
  const end = () => {
    if (y0 === null) return;
    sh.style.transition = ''; const v = dy / Math.max(1, performance.now() - t0);
    y0 = null;
    if (dy > 120 || v > .6) closeSheet(); else sh.style.transform = '';
  };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
  $('#backdrop').addEventListener('click', closeSheet);
  addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen) closeSheet(); });
})();

function go(tab) {
  const v = $('#v-' + tab);
  if (tab === cur) { v.scrollTo({top:0, behavior:RM.matches ? 'auto' : 'smooth'}); return; }
  cur = tab;
  $$('.view').forEach(x => { x.hidden = x !== v; });
  $$('.tb').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  if (tab === 'ch') { renderChallenges(); unseen = 0; }
  if (tab === 'hist') renderHistory();
  if (tab === 'set') renderSettings();
  updateBadge();
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  onScroll.call(v);
}
function onScroll() { this.querySelector('.nav').classList.toggle('scrolled', this.scrollTop > 34); }
$$('.view').forEach(v => v.addEventListener('scroll', onScroll, {passive:true}));
$('.tabbar').addEventListener('click', e => { const b = e.target.closest('.tb'); if (b) { go(b.dataset.tab); feedback('tick'); } });

function refreshAll() {
  renderChips(); updateCounter();
  if (cur === 'ch') renderChallenges();
  if (cur === 'hist') renderHistory();
  if (cur === 'set') renderSettings();
}

/* =========================================================
   EVENTOS DEL CONTADOR
   ========================================================= */
$('#btnUndo').innerHTML = ui('undo');
$('#btnNewCh').innerHTML = ui('plus');
$('#btnUndo').onclick = undo;
$('#btnFinish').onclick = finishSheet;
$('#btnNewCh').onclick = newChSheet;
$('#nextCh').onclick = () => go('ch');
$('#ringBtn').onclick = () => {
  if (S.diners.length < 2) { hud('Añade comensales para ver el total de la mesa'); return; }
  ringMode = ringMode === 'me' ? 'table' : 'me'; feedback('tick'); updateCounter();
};
$('#grid').addEventListener('click', e => {
  const m = e.target.closest('.pc-minus');
  if (m) { e.stopPropagation(); removeOne(m.closest('.pc').dataset.k); return; }
  const c = e.target.closest('.pc'); if (c) add(c.dataset.k, e);
});
$('#grid').addEventListener('keydown', e => {
  const c = e.target.closest('.pc'); if (!c || e.target !== c) return;
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); add(c.dataset.k); }
  if (e.key === 'Backspace' || e.key === '-') { e.preventDefault(); removeOne(c.dataset.k); }
});
(function chipEvents() {
  const box = $('#chips'); let lp, fired = false;
  box.addEventListener('pointerdown', e => {
    const c = e.target.closest('.chip[data-id]'); if (!c) return;
    fired = false; lp = setTimeout(() => { fired = true; feedback('tick'); dinerSheet(c.dataset.id); }, 520);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => box.addEventListener(ev, () => clearTimeout(lp)));
  box.addEventListener('scroll', () => clearTimeout(lp), {passive:true});
  box.addEventListener('contextmenu', e => e.preventDefault());
  box.addEventListener('click', e => {
    if (fired) { fired = false; return; }
    if (e.target.closest('#addDiner')) return dinerSheet();
    const c = e.target.closest('.chip[data-id]'); if (!c || c.dataset.id === S.active) return;
    S.active = c.dataset.id; save(); feedback('tick');
    $$('.chip[data-id]', box).forEach(x => { const on = x === c; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); });
    updateCounter();
  });
})();
document.addEventListener('touchstart', () => {}, {passive:true});

/* =========================================================
   ARRANQUE
   ========================================================= */
applyLook();
ODO.ring = new Odo($('#ringN'));
$('#ringBar').style.strokeDasharray = RC;
$('#ringBar').style.strokeDashoffset = RC;
renderChips();
buildGrid();
let tickN = 0;
setInterval(() => {
  if (!S.session.start) return;
  updateTime();
  if (++tickN % 15 === 0) { S.diners.forEach(d => checkUnlocks(d.id)); updateCounter(); }
}, 1000);
})();
</script>
