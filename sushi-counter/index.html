<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sushi">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--ARTIFACT-START-->
<title>Contador de Sushi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: app de pestañas al estilo iOS 26. Botones y barra de pestañas flotantes de cristal, títulos grandes, hojas flotantes y menús contextuales. */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F7F7FA; --sheet:#F2F2F7; --sheet-card:#FFFFFF; --seg-th:#FFFFFF;
  --label:#000000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2);
  --glass:rgba(255,255,255,.66); --glass-brd:rgba(255,255,255,.85); --glass-in:rgba(255,255,255,.55);
  --glass-sh:0 10px 30px rgba(20,20,40,.12),0 1px 3px rgba(20,20,40,.08);
  --rim:rgba(0,0,0,.07); --shd:rgba(30,20,10,.13); --medal-off:#D6D6DC;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 6px 20px rgba(40,30,20,.05);
  --green:#34C759; --red:#FF3B30; --orange:#FF9500; --gold:#FFB800; --blue:#007AFF;
  --accent:#FA5D3C;
  --accent-soft:color-mix(in srgb,var(--accent) 13%,transparent);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;
  --round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
  --spring:cubic-bezier(.32,.72,0,1);
  --bounce:cubic-bezier(.34,1.56,.64,1);
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --navh:56px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --sheet:#1C1C1E; --sheet-card:#2C2C2E; --seg-th:#636366;
    --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.28);
    --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
    --glass:rgba(48,48,52,.58); --glass-brd:rgba(255,255,255,.16); --glass-in:rgba(255,255,255,.08);
    --glass-sh:0 10px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
    --rim:rgba(255,255,255,.2); --shd:rgba(0,0,0,.55); --medal-off:#3A3A3C;
    --shadow:none; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --gold:#FFD60A; --blue:#0A84FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --sheet:#1C1C1E; --sheet-card:#2C2C2E; --seg-th:#636366;
  --label:#FFFFFF; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.28);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.36);
  --glass:rgba(48,48,52,.58); --glass-brd:rgba(255,255,255,.16); --glass-in:rgba(255,255,255,.08);
  --glass-sh:0 10px 30px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  --rim:rgba(255,255,255,.2); --shd:rgba(0,0,0,.55); --medal-off:#3A3A3C;
  --shadow:none; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --gold:#FFD60A; --blue:#0A84FF;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.41px;overflow:hidden;touch-action:manipulation;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;letter-spacing:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:12px}
svg{display:block}
.num{font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:0}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);box-shadow:inset 0 0 0 .5px var(--glass-brd),inset 0 1px 0 var(--glass-in),var(--glass-sh)}

/* ---------- Estructura ---------- */
.app{position:fixed;inset:0;background:#000}
.stage{position:absolute;inset:0;background:var(--bg);transform-origin:50% 0;transition:transform .55s var(--spring),border-radius .55s var(--spring),filter .55s;overflow:hidden}
body.sheet-open .stage{transform:translateY(calc(var(--st) + 10px)) scale(.93);border-radius:28px;filter:brightness(.9)}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(120px + var(--sb))}
.view.enter{animation:viewIn .45s var(--spring)}
@keyframes viewIn{from{opacity:0;transform:scale(.985) translateY(8px)}to{opacity:1;transform:none}}
.nav{position:sticky;top:0;z-index:20;padding-top:var(--st)}
.nav::before{content:"";position:absolute;inset:0 0 -26px;background:linear-gradient(var(--bg) 35%,color-mix(in srgb,var(--bg) 0%,transparent));-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.nav.scrolled::before{opacity:1}
.nav-in{position:relative;height:var(--navh);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-left:var(--gl);padding-right:var(--gr)}
.nav-t{font-weight:600;font-size:17px;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .3s var(--spring);white-space:nowrap}
.nav.scrolled .nav-t{opacity:1;transform:none}
#v-count .nav-t{visibility:hidden}
.nav-l{justify-self:start;display:flex;gap:8px}.nav-r{justify-self:end;display:flex;gap:8px}
.gb{height:44px;min-width:44px;border:0;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;color:var(--label);font-size:17px;font-weight:500;transition:transform .35s var(--bounce),opacity .2s,color .2s}
.gb svg{width:21px;height:21px}
.gb.ic{padding:0;width:44px}
.gb.tint{background:var(--accent);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.3);-webkit-backdrop-filter:none;backdrop-filter:none;font-weight:600}
.gb:active{transform:scale(.9)}
.gb:disabled{opacity:.38;transform:none}
.gb.tint:disabled{background:var(--fill2);color:var(--label2);box-shadow:none}
.content{padding-left:var(--gl);padding-right:var(--gr);max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:0;text-wrap:balance}
.lt-sub{margin:2px 0 0;color:var(--label2);font-size:15px;letter-spacing:-.24px}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow)}
.ctitle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.2px;color:var(--label2)}
.ctitle button{border:0;background:none;color:var(--accent);font-size:15px;font-weight:500;text-transform:none;letter-spacing:-.24px;padding:0;display:flex;align-items:center;gap:4px}

/* ---------- Comensales ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 4px var(--gl)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:5px 12px 5px 5px;background:var(--card);box-shadow:var(--shadow),inset 0 0 0 .5px var(--sep);transition:background-color .4s var(--spring),color .3s,transform .35s var(--bounce);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.chip:active{transform:scale(.94)}
.chip .av{width:28px;height:28px;font-size:13px}
.chip-n{font-weight:600;font-size:15px;letter-spacing:-.24px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-c{font-family:var(--round);font-weight:800;font-size:13px;min-width:22px;padding:2px 6px;border-radius:99px;background:var(--fill);text-align:center;font-variant-numeric:tabular-nums}
.chip.on{background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 35%,transparent)}
.chip.on .chip-c{background:rgba(255,255,255,.25)}
.chip.on .av{background:#fff;color:var(--c)}
.chip.add{padding:0;width:38px;height:38px;justify-content:center;color:var(--accent)}
.chip.add svg{width:20px;height:20px}
.av{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font-family:var(--round);font-weight:900;flex:0 0 auto;transition:background-color .35s,color .35s}
.av.xl{width:88px;height:88px;font-size:40px;box-shadow:0 12px 30px color-mix(in srgb,var(--c) 40%,transparent)}
.av.md{width:34px;height:34px;font-size:15px}
.av.sm{width:22px;height:22px;font-size:11px}

/* ---------- Héroe ---------- */
.hero{padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring-btn{border:0;background:none;padding:0;position:relative;width:min(150px,40vw);aspect-ratio:1;max-width:100%;border-radius:50%;-webkit-user-select:none;user-select:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16}
.ring-track{stroke:var(--fill)}
.ring-bar{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1s var(--spring),stroke .5s}
.ring-bar.full{stroke:url(#g-goldring)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ring-k{font-size:11px;font-weight:700;color:var(--label2);text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:4px;max-width:80%;overflow:hidden;white-space:nowrap}
.ring-k i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent));flex:0 0 auto}
.ring-n{font-size:clamp(40px,12vw,52px);font-weight:900;line-height:1}
.ring-s{font-size:12px;color:var(--label2);letter-spacing:-.1px}
.ring-btn.bump .ring-n{animation:bump .45s var(--bounce)}
@keyframes bump{40%{transform:scale(1.1)}}
.hstats{display:flex;flex-direction:column;min-width:0}
.hs{display:flex;align-items:center;gap:10px;padding:8px 0}
.hs+.hs{border-top:.5px solid var(--sep)}
.hs svg{width:20px;height:20px;color:var(--accent);flex:0 0 auto}
.hs-l{flex:1;font-size:15px;color:var(--label2);letter-spacing:-.24px;white-space:nowrap}
.hs-v{font-family:var(--round);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}

/* La cuenta */
.bill{padding:16px;display:flex;flex-direction:column;gap:12px}
.bill-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bill-3 div{display:flex;flex-direction:column;gap:2px;min-width:0}
.bill-3 span{font-size:12px;color:var(--label2);font-weight:500;white-space:nowrap}
.bill-3 b{font-family:var(--round);font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bill-3 .c-cost b{color:var(--accent)}
.bill-3 .c-carta b{color:var(--blue)}
.bbar{position:relative;height:12px;border-radius:99px;background:var(--fill);overflow:hidden}
.bbar i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--accent);transition:width 1s var(--spring)}
.bbar.lose i{background:var(--green)}
.bill-t{margin:0;font-size:15px;letter-spacing:-.24px;line-height:1.35}
.bill-t b{font-weight:600}
.bill-t.lose b{color:var(--green)}
.bill-s{margin:-6px 0 0;font-size:13px;color:var(--label2);letter-spacing:-.08px;line-height:1.35}

/* Misiones (mini) */
.mini-m{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;width:100%;transition:transform .4s var(--bounce)}
.mini-m:active{transform:scale(.985)}
.mm{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center}
.mm-ic{width:30px;height:30px;display:grid;place-items:center;color:var(--accent)}
.mm-ic svg{width:30px;height:30px}
.mm-ic .mono{width:22px;height:22px}
.mm-t{font-size:15px;font-weight:500;letter-spacing:-.24px;display:flex;flex-direction:column;gap:5px;min-width:0}
.mm-t > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mm-p{font-family:var(--round);font-weight:800;font-size:14px;color:var(--label2);font-variant-numeric:tabular-nums;letter-spacing:0;white-space:nowrap}
.mm.done .mm-t span:first-child{color:var(--label2);text-decoration:line-through;text-decoration-color:var(--label3)}
.mm.done .mm-p{color:var(--green)}

.meter{position:relative;height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:inherit;background:var(--accent);transition:width .8s var(--spring);transform-origin:left}
.meter.ok i{background:var(--green)}
.meter.lg{height:8px}
.meter.anim i{animation:grow .9s var(--spring)}
@keyframes grow{from{transform:scaleX(0)}}

/* ---------- Píldoras de categoría ---------- */
.pills{position:sticky;top:calc(var(--st) + var(--navh));z-index:15;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) -4px calc(-1 * var(--gl));padding:6px var(--gr) 10px var(--gl);background:linear-gradient(var(--bg) 70%,color-mix(in srgb,var(--bg) 0%,transparent))}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:0;border-radius:99px;padding:8px 15px;font-size:15px;font-weight:600;letter-spacing:-.24px;background:var(--card);color:var(--label);box-shadow:var(--shadow),inset 0 0 0 .5px var(--sep);transition:background-color .3s,color .3s,transform .3s var(--bounce)}
.pill:active{transform:scale(.94)}
.pill.on{background:var(--label);color:var(--bg)}

/* ---------- Piezas ---------- */
.cats{display:flex;flex-direction:column;gap:22px}
.cat-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 10px;font-size:22px;font-weight:700;letter-spacing:.35px}
.cat-h span{font-size:15px;font-weight:500;color:var(--label2);letter-spacing:-.24px}
.grid{display:grid;gap:10px}
.grid.compact{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.big{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:560px){.grid.compact{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.big{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:740px){.grid.compact{grid-template-columns:repeat(5,minmax(0,1fr))}.grid.big{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{position:relative;background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:transform .5s var(--bounce),box-shadow .3s;isolation:isolate}
.pc:active{transform:scale(.95);transition-duration:.15s}
.pc.lift{transform:scale(1.05)!important;transition-duration:.25s}
.pc-ic svg{width:100%;height:100%;overflow:visible}
.pc-name{font-weight:600;letter-spacing:-.2px}
.pc-meta{color:var(--label2);letter-spacing:0;font-variant-numeric:tabular-nums}
.pc-minus{border:0;display:grid;place-items:center;color:var(--label);transition:transform .45s var(--bounce),opacity .25s;z-index:2}
.pc-minus svg{width:15px;height:15px}
.pc-minus:active{transform:scale(.82)}
.pc.zero .pc-minus{transform:scale(.3);opacity:0;pointer-events:none}
.pc-plus{display:none}
.pc .fav{position:absolute;width:12px;height:12px;color:var(--gold)}
.pc-txt{display:contents}
.grid.compact .pc{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 6px 10px;gap:3px;min-height:126px}
.grid.compact .pc-ic{width:56px;height:56px;margin-top:4px}
.grid.compact .pc-name{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.grid.compact .pc-meta{font-size:11px}
.grid.compact .pc-n{position:absolute;top:8px;right:8px;height:auto;font-size:15px;font-weight:900;color:#fff;background:var(--accent);padding:4px 7px;border-radius:99px;min-width:25px;justify-content:center;box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 40%,transparent);transition:transform .45s var(--bounce),opacity .25s}
.grid.compact .pc.zero .pc-n{transform:scale(.3);opacity:0}
.grid.compact .pc-minus{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:50%}
.grid.compact .pc .fav{bottom:9px;right:9px}
.grid.big .pc{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;gap:2px 8px;padding:14px 14px 12px;min-height:140px}
.grid.big .pc-ic{grid-row:1;grid-column:1;width:60px;height:60px;margin:-4px 0 0 -4px}
.grid.big .pc-n{grid-row:1;grid-column:2;justify-self:end;font-size:34px;font-weight:900}
.grid.big .pc.zero .pc-n{color:var(--label3)}
.grid.big .pc-txt{grid-row:3;grid-column:1/3;display:flex;flex-direction:column;gap:1px;padding-right:40px;min-width:0}
.grid.big .pc-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.big .pc-meta{font-size:12px}
.grid.big .pc-minus{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:50%}
.grid.big .pc .fav{top:12px;left:64px}
.grid.list{grid-template-columns:minmax(0,1fr);gap:0;background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}
.grid.list .pc{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:0;box-shadow:none;background:none}
.grid.list .pc+.pc::before{content:"";position:absolute;top:0;left:72px;right:0;height:.5px;background:var(--sep)}
.grid.list .pc:active{transform:none;background:var(--fill)}
.grid.list .pc-ic{width:48px;height:48px;flex:0 0 auto}
.grid.list .pc-txt{order:2;flex:1;display:flex;flex-direction:column;min-width:0}
.grid.list .pc-name{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid.list .pc-meta{font-size:12px}
.grid.list .pc-n{order:3;font-size:24px;font-weight:900}
.grid.list .pc.zero .pc-n{color:var(--label3)}
.grid.list .pc-minus{order:4;width:32px;height:32px;border-radius:50%;flex:0 0 auto}
.grid.list .pc-plus{order:5;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;flex:0 0 auto}
.grid.list .pc-plus svg{width:16px;height:16px}
.grid.list .pc .fav{left:50px;top:8px}
.rip{position:absolute;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:-1}
.plus1{position:absolute;pointer-events:none;font-family:var(--round);font-weight:900;font-size:22px;color:var(--accent);z-index:3;margin:-14px 0 0 -14px}

/* ---------- Listas agrupadas ---------- */
.gsec{display:flex;flex-direction:column}
.glabel{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.08px;margin:12px 16px 7px}
.gfoot{font-size:13px;color:var(--label2);letter-spacing:-.08px;margin:7px 16px 0;line-height:1.38}
.group{background:var(--card);border-radius:26px;overflow:hidden}
.sheet .group{background:var(--sheet-card)}
.group.pad{padding:14px 16px}
.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 16px;border:0;background:none;text-align:left;color:var(--label);font-size:17px}
.row+.row::before{content:"";position:absolute;top:0;right:0;left:var(--ins,16px);height:.5px;background:var(--sep)}
button.row:active,.row.tap:active{background:var(--fill)}

.odo{display:inline-flex;height:1em;line-height:1;overflow:hidden;font-variant-numeric:tabular-nums}

}

function lifetime() {

  const weekAgo = Date.now() - 7*86400000;
  const take = (cnt, date, durMin, buffet, nDiners, medals) => {
    const n = sum(cnt); if (!n) return;
    L.sessions++; L.pieces += n; L.best = Math.max(L.best, n); L.cost += costOf(cnt); L.mins += durMin; L.medals += medals;
    Object.keys(cnt).forEach(k => cnt[k] && L.types.add(k)); L.buffets.add((buffet||'').trim().toLowerCase());
    const dt = new Date(date), h = dt.getHours(), wd = dt.getDay();
    if (h >= 22 || h < 4) L.night = true; if (h >= 11 && h < 14) L.noon = true; if (wd === 0 || wd === 6) L.weekend = true;
    if (nDiners >= 4) L.group = true; if (date >= weekAgo) L.weekSessions++;
    if (new Set(Object.keys(cnt).filter(k => cnt[k]).map(catOf)).size >= 5) L.catsAll = true;
  };
  S.history.filter(h => !h.ex).forEach(h => { const d = h.diners.find(x => x.me) || h.diners[0]; if (d) take(d.counts, h.date, h.dur/60000, h.buffet, h.diners.length, (d.medals||[]).length); });
  if (S.session.start) { const c = ctx(m.id); take(c.by, S.session.start, c.el, S.settings.buffet, S.diners.length, (S.session.done[m.id]||[]).length); }
  return L;
}

const CAT_TARGET = {nigiri:10, roll:12, hot:6, side:2, dessert:2};
const BIG_UNITS = ['plato','bol','ración','copa','cono','crep','brocheta'];
function genMission(kind, usedT) {
  const vis = S.types.filter(t => t.on);
  const free = vis.filter(t => !usedT.includes(t.id)); const pool = free.length ? free : vis;
  if (kind === 'eat') { const t = pick(pool); const n = BIG_UNITS.includes(t.unit) ? 1 + rnd(2) : 4 + rnd(5); return {k:'eat', type:t.id, n}; }
  if (kind === 'cat') { const cs = CATS.filter(c => vis.some(t => t.cat === c.id)); const c = pick(cs); return {k:'cat', cat:c.id, n:CAT_TARGET[c.id]}; }
  if (kind === 'new') { const L = lifetime(); const nv = pool.filter(t => !L.types.has(t.id)); const t = nv.length ? pick(nv) : pick(pool); return {k:'new', type:t.id, n:1}; }
  if (kind === 'norep') return {k:'norep', n:5 + rnd(3)};
  if (kind === 'speed') return {k:'speed', n:6 + rnd(4), mins:3};
  if (kind === 'var') return {k:'var', n:5 + rnd(3)};
  if (kind === 'cost') return {k:'cost', n:[3,4,5][rnd(3)]};
  if (kind === 'kcal') return {k:'kcal', n:[1000,1200,1500][rnd(3)]};
  return {k:'dessert', n:25};
}
function newMissions(prev = []) {
  const kinds = ['eat','cat','new','norep','speed','var','cost','kcal','dessert'];
  const out = prev.filter(m => m.done);
  const usedT = out.filter(m => m.type).map(m => m.type);
  let guard = 0;
  while (out.length < 3 && guard++ < 60) {
    const k = pick(kinds);
    if (k !== 'eat' && out.some(m => m.k === k)) continue;
    const m = genMission(k, usedT);
    if (m.type) { if (usedT.includes(m.type)) continue; usedT.push(m.type); }
    m.id = 'm' + Math.random().toString(36).slice(2, 8); m.xp = 30; out.push(m);
  }
  return out;
}
function missionsOf(id) {
  const ms = S.session.missions;
  if (!ms[id]) { ms[id] = {list:newMissions(), rerolls:1}; save(); }
  return ms[id];
}
const catName = id => CATS.find(c => c.id === id)?.name.toLowerCase() || id;
function mText(m) {

    case 'cat': return `${m.n} de ${catName(m.cat)}`;
    case 'new': return `Prueba: ${tname(m.type)}`;
    case 'norep': return `${m.n} seguidas sin repetir tipo`;
    case 'speed': return `${m.n} piezas en ${m.mins} minutos`;
    case 'var': return `Prueba ${m.n} tipos distintos`;
    case 'cost': return `Cuesta ${money(m.n,0)} al restaurante`;

}
function mEval(m, c) {

    case 'norep': return [noRepeatRun(c.log), m.n];
    case 'speed': return [bestWindow(c.log, m.mins*60000), m.n];
    case 'var': return [c.distinct, m.n];

    case 'kcal': return [c.kcal, m.n, `${nf0(Math.min(c.kcal, m.n))} / ${nf0(m.n)}`];
    default: { let n = 0, ok = false; for (const e of c.log) { if (catOf(e.k) === 'dessert' && n >= m.n) ok = true; n++; } return [ok ? 1 : Math.min(c.total, m.n)/m.n*.9, 1, ok ? 'Hecho' : `${Math.min(c.total, m.n)} / ${m.n}`]; }

function checkAll(id) {
  if (!S.session.log.length) return;
  const got = [];
  for (const ch of allCh()) {
    if (isDone(id, ch.id)) continue;
    if (evalCh(ch, id).p >= 1) { (S.session.done[id] = S.session.done[id] || []).push(ch.id); got.push(ch); enqueue({kind:'Desafío completado', item:ch, who:id}); if (id === me().id) addXP(TIER_XP[ch.tier]); }
  }
  const mm = missionsOf(id);
  for (const m of mm.list) if (!m.done && mProg(m, id).p >= 1) { m.done = true; got.push(m); enqueue({kind:'Misión cumplida', mission:m, who:id}); if (id === me().id) addXP(m.xp); }
  if (id === me().id) {
    const L = lifetime();
    for (const a of ACH) {
      if (S.ach[a.id]) continue;
      const [c0, mx] = a.f(L); if (mx > 0 && c0 >= mx) { S.ach[a.id] = Date.now(); got.push(a); enqueue({kind:'Logro desbloqueado', item:a, who:id}); addXP(TIER_XP[a.tier]); }
    }
    const prevBest = Math.max(0, ...S.history.filter(h => !h.ex).map(h => { const d = h.diners.find(x => x.me) || h.diners[0]; return d ? sum(d.counts) : 0; }));
    const n = ctx(id).total;

  }

}

function tone(f, at, d, type='sine', vol=.12, glide=1.5) {

  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + d);

    else if (kind === 'remove') tone(330, 0, .1, 'triangle', .1, .7);
    else if (kind === 'unlock') [523, 659, 784, 1047].forEach((f, i) => tone(f, i*.085, .28, 'triangle', .09, 1.01));
    else if (kind === 'tick' || kind === 'long') tone(kind === 'long' ? 600 : 900, 0, .04, 'sine', .04, 1);
  }
  if (S.settings.haptics && navigator.vibrate) { try { navigator.vibrate(kind === 'unlock' ? [18, 50, 24] : kind === 'remove' ? 6 : kind === 'long' ? 16 : 10); } catch (e) {} }
}

const FX = {p:[], raf:0};

const undoStack = [];

function addN(k, n = 1, ev) {

  if (!S.session.start) S.session.start = now;
  const entries = [];
  for (let i = 0; i < n; i++) { const e = {t:now + i, d:S.active, k}; S.session.log.push(e); entries.push(e); }
  pushAction({kind:'add', entries});
  feedback('add'); popFx(k, ev, n);
  const rb = $('#ringBtn'); rb.classList.remove('bump'); void rb.offsetWidth; rb.classList.add('bump');
  save(); updateCounter(); snack(k, `${n > 1 ? `+${n} · ` : ''}Añadido${S.diners.length > 1 ? ' a ' + diner(S.active).name : ''}`); checkAll(S.active);
}
function removeEntries(pred, max = Infinity, label) {
  const removed = [];
  for (let i = S.session.log.length - 1; i >= 0 && removed.length < max; i--) if (pred(S.session.log[i])) removed.push(S.session.log.splice(i, 1)[0]);
  if (!removed.length) return 0;
  if (!S.session.log.length) S.session.start = null;
  pushAction({kind:'remove', entries:removed});
  feedback('remove'); save(); updateCounter();
  snack(removed[0].k, label || `Quitado${removed.length > 1 ? ` ×${removed.length}` : ''}`);
  return removed.length;
}
const removeOne = k => removeEntries(e => e.d === S.active && e.k === k, 1);
function undo() {

  else { S.session.log.push(...a.entries); S.session.log.sort((x, y) => x.t - y.t); }

  const n = a.entries.length;
  snack(a.entries[0].k, a.kind === 'add' ? `Deshecho · quitado${n > 1 ? ` ×${n}` : ''}` : `Deshecho · recuperado${n > 1 ? ` ×${n}` : ''}`, false);

    mount(el) {

        row.style.transition = 'height .35s cubic-bezier(.32,.72,0,1),opacity .25s'; row.style.height = row.offsetHeight + 'px'; void row.offsetHeight; row.style.height = '0px'; row.style.opacity = '0';
        setTimeout(() => { removeEntries(e => e.t === t && e.k === k && e.d === d, 1, 'Eliminado del registro'); draw(el); }, 300);
      };
      const list = $('#logList', el); let drag = null;
      list.addEventListener('click', e => { const r = e.target.closest('.sw-row'); if (r && (e.target.closest('.sw-x') || e.target.closest('.sw-del'))) del(r); });
      list.addEventListener('pointerdown', e => {
        const r = e.target.closest('.sw-row'); if (!r || e.target.closest('button')) return;
        $$('.sw-c', list).forEach(c => { if (c.parentNode !== r) c.style.transform = ''; });
        const c = $('.sw-c', r); const base = parseFloat((c.style.transform.match(/-?[\d.]+/) || [0])[0]);
        drag = {r, c, x0:e.clientX, y0:e.clientY, base, dx:base, on:false, id:e.pointerId};
      });
      list.addEventListener('pointermove', e => {
        if (!drag) return; const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
        if (!drag.on) { if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) { drag.on = true; drag.c.classList.add('drag'); try { list.setPointerCapture(drag.id); } catch (er) {} } else if (Math.abs(dy) > 8) { drag = null; return; } else return; }
        drag.dx = Math.min(0, drag.base + dx); drag.c.style.transform = `translateX(${drag.dx}px)`;
      });
      const end = () => {
        if (!drag) return; const {r, c, dx, on} = drag; drag = null; if (!on) return;
        c.classList.remove('drag');
        if (dx < -r.offsetWidth * .5) { c.style.transform = `translateX(${-r.offsetWidth}px)`; del(r); }
        else c.style.transform = dx < -50 ? 'translateX(-96px)' : '';
      };
      list.addEventListener('pointerup', end); list.addEventListener('pointercancel', end);
    }});
}

const MONTHS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const sTotal = s => s.diners.reduce((a, d) => a + sum(d.counts), 0);
function niceStep(x) { const p = 10 ** Math.floor(Math.log10(x || 1)), m = x / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; }
function chart(list) {
  const L = list.slice(-8); if (L.length < 2) return '';
  const W = 330, H = 176, l = 30, r = 6, t = 18, b = 24, pw = W - l - r, ph = H - t - b;
  const vals = L.map(sTotal), max = Math.max(...vals, 1), step = niceStep(max / 3), top = Math.ceil(max / step) * step;
  let g = '';
  for (let v = 0; v <= top; v += step) { const y = t + ph - v / top * ph; g += `<line class="gl" x1="${l}" x2="${W - r}" y1="${y}" y2="${y}"/><text class="tx" x="${l - 6}" y="${y + 3.5}" text-anchor="end">${v}</text>`; }
  const slot = pw / L.length, bw = Math.min(30, slot * .58);
  L.forEach((s, i) => {
    const v = vals[i], h = Math.max(2, v / top * ph), x = l + i * slot + (slot - bw) / 2, y = t + ph - h, dt = new Date(s.date);
    g += `<rect class="bar${i === L.length - 1 ? ' cur' : ''}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="7" style="animation-delay:${i * 60}ms"/>
      <text class="tv" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${v}</text><text class="tx" x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${dt.getDate()} ${MONTHS[dt.getMonth()]}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Piezas por sesión">${g}</svg>`;
}

const stepper = id => `<div class="stepper" data-stepper="${id}"><button data-dir="-1" aria-label="Menos">${ui('minus')}</button><i></i><button data-dir="1" aria-label="Más">${ui('plus')}</button></div>`;
function bindStepper(root, id, fn) {
  const box = root.querySelector(`[data-stepper="${id}"]`); if (!box) return;
  box.querySelectorAll('button').forEach(b => {
    let t1, t2; const stop = () => { clearTimeout(t1); clearInterval(t2); };
    b.addEventListener('pointerdown', e => { e.preventDefault(); const dir = +b.dataset.dir; fn(dir); feedback('tick'); t1 = setTimeout(() => { t2 = setInterval(() => fn(dir), 70); }, 420); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(+b.dataset.dir); } });
  });
}

    </div></div>
    <div class="gsec"><div class="glabel">Comensales</div><div class="group">
      ${S.diners.map((d, i) => `<button class="row" style="--ins:62px" data-diner="${d.id}"><span class="av md" style="--c:${d.color}">${esc(initial(d.name))}</span><span class="row-l">${esc(d.name)}${i === 0 ? '<span class="sub">Propietario: suma logros y nivel</span>' : ''}</span>${ui('chev','chev')}</button>`).join('')}
      <button class="row accent" id="addDiner2" style="--ins:62px"><span style="width:34px;display:grid;place-items:center">${ui('plus', '', 'width:22px;height:22px')}</span><span class="row-l">Añadir comensal</span></button>
    </div><p class="gfoot">Mantén pulsado un comensal en el contador para editarlo.</p></div>
    ${CATS.map(c => `<div class="gsec"><div class="glabel">${c.name}</div><div class="group">
      ${S.types.filter(t => t.cat === c.id).sort((a, b) => ORDER[a.id] - ORDER[b.id]).map(t => `<div class="row tap" style="--ins:64px;cursor:pointer" data-type="${t.id}" tabindex="0" role="button"><span class="ricon">${icon(t.id)}</span><span class="row-l">${esc(t.name)}<span class="sub">${money(t.cost)} coste · ${money(t.carta)} carta · ${t.kcal} kcal</span></span>
        <label class="sw" aria-label="Mostrar ${esc(t.name)}"><input type="checkbox" data-ton="${t.id}" ${t.on ? 'checked' : ''}><span></span></label></div>`).join('')}
    </div></div>`).join('')}
    <div class="gsec"><div class="group"><button class="row accent" id="resetCosts" style="justify-content:center">Restaurar costes estimados</button></div>
      <p class="gfoot">Toca una pieza para cambiar su nombre, coste, precio en carta o calorías. También puedes mantenerla pulsada en el contador.</p></div>
    <div class="gsec"><div class="glabel">Apariencia</div><div class="group">
      <div class="row">${seg('theme', [['system', 'Sistema'], ['light', 'Claro'], ['dark', 'Oscuro']])}</div>
      <div class="row">${seg('layout', [['compact', 'Compacta'], ['big', 'Grande'], ['list', 'Lista']])}</div>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:12px;padding:14px 16px">
        <div style="display:flex;justify-content:space-between"><span>Color de acento</span><span class="row-v" id="acName">${ac.name} · ${ac.m}</span></div>
        <div class="swatches" id="acSw">${ACCENTS.map(a => `<button class="swc${a.id === st.accent ? ' on' : ''}" data-ac="${a.id}" style="--c:${a.c}" aria-label="${a.name}"></button>`).join('')}</div>
      </div>
    </div></div>
    <div class="gsec"><div class="glabel">Respuesta</div><div class="group">
      <div class="row"><span class="row-l">Sonidos</span><label class="sw"><input type="checkbox" id="inSound" ${st.sound ? 'checked' : ''}><span></span></label></div>
      <div class="row"><span class="row-l">Vibración</span><label class="sw"><input type="checkbox" id="inHap" ${st.haptics ? 'checked' : ''}><span></span></label></div>
    </div><p class="gfoot">Safari en iPhone no permite que las webs vibren; en Android sí funciona.</p></div>
    <div class="gsec"><div class="glabel">Datos</div><div class="group">
      ${S.history.some(h => h.ex) ? '<button class="row accent" id="delEx" style="justify-content:center">Quitar sesiones de ejemplo</button>' : ''}
      <button class="row danger" id="delHist">Borrar historial</button>
      <button class="row danger" id="resetAll">Restablecer todo</button>
    </div><p class="gfoot">Todo se guarda solo en este dispositivo.</p></div>`;
  wireSettings();
}
function wireSettings() {
  const root = $('#setBody'), st = S.settings;
  $('#inBuffet').addEventListener('input', e => { st.buffet = e.target.value.trim() || 'Buffet libre'; save(); updateCounter(); });
  $('#inPrice').addEventListener('change', e => { st.price = Math.max(0, parseNum(e.target.value)); e.target.value = fmtDec(st.price); save(); updateCounter(); });
  $$('.seg', root).forEach(sg => sg.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const key = sg.dataset.seg, btns = $$('button', sg);
    st[key] = b.dataset.v; sg.style.setProperty('--i', btns.indexOf(b)); btns.forEach(x => x.setAttribute('aria-pressed', x === b));
    save(); feedback('tick');
    if (key === 'theme') applyLook();
    if (key === 'layout') buildGrid();
    if (key === 'cur') { buildGrid(); setTimeout(renderSettings, 350); }
  }));
  bindStepper(root, 'goal', dir => { st.goal = Math.max(5, Math.min(400, st.goal + dir * 5)); $('#goalV').textContent = st.goal; save(); updateCounter(); });
  root.addEventListener('click', e => {
    const dn = e.target.closest('[data-diner]'); if (dn) return dinerSheet(dn.dataset.diner);
    if (e.target.closest('#addDiner2')) return dinerSheet();
    if (e.target.closest('.sw')) return;
    const tp = e.target.closest('[data-type]'); if (tp) return typeSheet(tp.dataset.type);
    const a = e.target.closest('[data-ac]');
    if (a) { st.accent = a.dataset.ac; applyLook(); save(); feedback('tick'); $$('[data-ac]', root).forEach(x => x.classList.toggle('on', x === a)); const ac = ACCENTS.find(x => x.id === st.accent); $('#acName').textContent = `${ac.name} · ${ac.m}`; }
  });
  root.addEventListener('keydown', e => { const tp = e.target.closest('[data-type]'); if (tp && e.target === tp && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); typeSheet(tp.dataset.type); } });
  root.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.ton) { typeById(t.dataset.ton).on = t.checked; save(); buildGrid(); feedback('tick'); }
    if (t.id === 'inSound') { st.sound = t.checked; save(); feedback('tick'); }
    if (t.id === 'inHap') { st.haptics = t.checked; save(); feedback('tick'); }
  });
  $('#resetCosts').onclick = () => { S.types.forEach(t => { const d = DEFAULT_TYPES.find(x => x.id === t.id); t.cost = d.cost; t.carta = d.carta; }); save(); buildGrid(); renderSettings(); hud('Costes restaurados'); };
  const ex = $('#delEx'); if (ex) ex.onclick = () => { S.history = S.history.filter(h => !h.ex); save(); renderSettings(); hud('Ejemplos eliminados'); };
  twoStep($('#delHist'), 'Toca otra vez para borrar', () => { S.history = []; S.trophies = {}; save(); renderSettings(); hud('Historial borrado'); });
  twoStep($('#resetAll'), 'Toca otra vez para restablecer', () => { S = fresh(); S.history = []; undoStack.length = 0; applyLook(); save(); buildGrid(); refreshAll(); renderSettings(); hud('Todo restablecido'); });
}
function twoStep(btn, label, fn) {
  let armed = false, t; const old = btn.textContent;
  btn.addEventListener('click', () => {
    if (armed) { clearTimeout(t); fn(); return; }
    armed = true; btn.textContent = label; btn.classList.add('armed'); feedback('tick');
    t = setTimeout(() => { armed = false; btn.textContent = old; btn.classList.remove('armed'); }, 3000);
  });
}

/* =========================================================
   HOJA MODAL
   ========================================================= */
let sheetOpen = null, sheetCloseT;
function openSheet(o) {
  const sh = $('#sheet'), bd = $('#backdrop');
  clearTimeout(sheetCloseT); closeCtx(true);
  sh.innerHTML = `<div class="sh-head"><button class="gb" data-x>${o.cancel || 'Cancelar'}</button><h3>${esc(o.title)}</h3>${o.ok ? `<button class="gb tint" data-ok>${o.ok}</button>` : '<span></span>'}</div><div class="sh-body">${o.body}</div>`;
  sh.setAttribute('aria-label', o.title); sh.style.transform = ''; sh.scrollTop = 0;
  sh.hidden = false; bd.hidden = false; void sh.offsetHeight;
  document.body.classList.add('sheet-open'); sheetOpen = o;
  $('[data-x]', sh).onclick = closeSheet;
  const ok = $('[data-ok]', sh); if (ok) ok.onclick = () => { if (o.onOk && o.onOk(sh) === false) return; closeSheet(); };
  o.mount && o.mount(sh);
}
function closeSheet() {
  const sh = $('#sheet');
  document.body.classList.remove('sheet-open'); sh.style.transform = ''; sheetOpen = null;
  sheetCloseT = setTimeout(() => { sh.hidden = true; $('#backdrop').hidden = true; sh.innerHTML = ''; }, 500);
}
(function dragToDismiss() {
  const sh = $('#sheet'); let y0 = null, dy = 0, t0 = 0;
  sh.addEventListener('pointerdown', e => { if (!e.target.closest('.sh-head') || e.target.closest('button')) return; y0 = e.clientY; dy = 0; t0 = performance.now(); sh.style.transition = 'none'; sh.setPointerCapture(e.pointerId); });
  sh.addEventListener('pointermove', e => { if (y0 === null) return; dy = e.clientY - y0; sh.style.transform = `translateY(${dy > 0 ? dy : dy / 6}px)`; });
  const end = () => { if (y0 === null) return; sh.style.transition = ''; const v = dy / Math.max(1, performance.now() - t0); y0 = null; if (dy > 120 || v > .6) closeSheet(); else sh.style.transform = ''; };
  sh.addEventListener('pointerup', end); sh.addEventListener('pointercancel', end);
  $('#backdrop').addEventListener('click', closeSheet);
  addEventListener('keydown', e => { if (e.key === 'Escape') { if (ctxOpen) closeCtx(); else if (sheetOpen) closeSheet(); } });
})();

/* =========================================================
   NAVEGACIÓN
   ========================================================= */
let cur = 'count';
const TABS = {count:['tCount', 'Contador'], ch:['tCh', 'Retos'], hist:['tHist', 'Historial'], set:['tSet', 'Ajustes']};
$$('.tb').forEach(b => { const [ic, l] = TABS[b.dataset.tab]; b.innerHTML = `${ui(ic)}<span>${l}</span>`; });
function go(tab) {
  const v = $('#v-' + tab);
  if (tab === cur) { v.scrollTo({top:0, behavior:RM.matches ? 'auto' : 'smooth'}); return; }
  cur = tab;
  $$('.view').forEach(x => { x.hidden = x !== v; });
  $$('.tb').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#tbPill').style.setProperty('--i', Object.keys(TABS).indexOf(tab));
  if (tab === 'ch') { renderRetos(); unseen = 0; }
  if (tab === 'hist') renderHistory();
  if (tab === 'set') renderSettings();
  updateBadge();
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  onScroll.call(v);
}
function onScroll() {
  this.querySelector('.nav').classList.toggle('scrolled', this.scrollTop > 30);
  if (this.id === 'v-count') spy();
}
$$('.view').forEach(v => v.addEventListener('scroll', onScroll, {passive:true}));
$('.tabbar').addEventListener('click', e => { const b = e.target.closest('.tb'); if (b) { go(b.dataset.tab); feedback('tick'); } });
function refreshAll() { renderChips(); updateCounter(); if (cur === 'ch') renderRetos(); if (cur === 'hist') renderHistory(); if (cur === 'set') renderSettings(); }

let spyLock = 0;
function pillOffset() { const v = $('#v-count'); return $('.nav', v).offsetHeight + $('#pills').offsetHeight; }
function spy() {
  if (Date.now() < spyLock) return;
  const v = $('#v-count'), off = pillOffset() + 12, vt = v.getBoundingClientRect().top;
  let on = 'top';
  $$('.catsec').forEach(s => { if (s.getBoundingClientRect().top - vt <= off) on = s.dataset.cat; });
  setPill(on);
}
function setPill(id) {
  $$('.pill').forEach(p => {
    const a = p.dataset.go === id;
    if (a !== p.classList.contains('on')) {
      p.classList.toggle('on', a);
      if (a) { const box = $('#pills'); box.scrollTo({left: p.offsetLeft - box.clientWidth/2 + p.offsetWidth/2, behavior:RM.matches ? 'auto' : 'smooth'}); }
    }
  });
}
$('#pills').addEventListener('click', e => {
  const p = e.target.closest('.pill'); if (!p) return;
  const v = $('#v-count'); feedback('tick'); setPill(p.dataset.go); spyLock = Date.now() + 800;
  const s = p.dataset.go === 'top' ? $('.catsec') : $(`.catsec[data-cat="${p.dataset.go}"]`); if (!s) return;
  v.scrollTo({top: s.getBoundingClientRect().top - v.getBoundingClientRect().top + v.scrollTop - pillOffset() - 4, behavior:RM.matches ? 'auto' : 'smooth'});
});

/* =========================================================
   EVENTOS DEL CONTADOR
   ========================================================= */
$('#btnUndo').innerHTML = ui('undo');
$('#btnLog').innerHTML = ui('list');
$('#btnNewCh').innerHTML = ui('plus');
$('#btnUndo').onclick = undo;
$('#btnLog').onclick = logSheet;
$('#btnFinish').onclick = finishSheet;
$('#btnNewCh').onclick = newChSheet;
$('#miniM').onclick = () => { retoSeg = 'mis'; go('ch'); };
$('#ringBtn').onclick = () => { if (S.diners.length < 2) { hud('Añade comensales para ver la mesa'); return; } ringMode = ringMode === 'me' ? 'table' : 'me'; feedback('tick'); updateCounter(); };
$('#chBody').addEventListener('click', e => { const r = e.target.closest('[data-ch]'); if (r) return chSheet(r.dataset.ch); const a = e.target.closest('[data-ach]'); if (a) achSheet(a.dataset.ach); });
$('#histBody').addEventListener('click', e => { const r = e.target.closest('[data-h]'); if (r) histSheet(r.dataset.h); });
(function cardEvents() {
  const box = $('#cats'); let lp = null, fired = false, sx = 0, sy = 0;
  box.addEventListener('pointerdown', e => {
    const c = e.target.closest('.pc'); if (!c || e.target.closest('.pc-minus')) return;
    fired = false; sx = e.clientX; sy = e.clientY;
    lp = setTimeout(() => { fired = true; lp = null; c.classList.add('lift'); setTimeout(() => { c.classList.remove('lift'); openCtx(c); }, 140); }, 430);
  });
  box.addEventListener('pointermove', e => { if (lp && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) { clearTimeout(lp); lp = null; } });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => box.addEventListener(ev, () => { clearTimeout(lp); lp = null; }));
  box.addEventListener('contextmenu', e => { const c = e.target.closest('.pc'); if (!c) return; e.preventDefault(); if (!fired) { fired = true; openCtx(c); } });
  box.addEventListener('click', e => {
    if (fired) { fired = false; return; }
    const m = e.target.closest('.pc-minus'); if (m) { e.stopPropagation(); removeOne(m.closest('.pc').dataset.k); return; }
    const c = e.target.closest('.pc'); if (c) addN(c.dataset.k, 1, e);
  });
  box.addEventListener('keydown', e => {
    const c = e.target.closest('.pc'); if (!c || e.target !== c) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); addN(c.dataset.k); }
    if (e.key === 'Backspace' || e.key === '-' || e.key === 'Delete') { e.preventDefault(); removeOne(c.dataset.k); }
    if (e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) { e.preventDefault(); openCtx(c); }
  });
})();
(function chipEvents() {
  const box = $('#chips'); let lp, fired = false;
  box.addEventListener('pointerdown', e => { const c = e.target.closest('.chip[data-id]'); if (!c) return; fired = false; lp = setTimeout(() => { fired = true; feedback('long'); dinerSheet(c.dataset.id); }, 520); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => box.addEventListener(ev, () => clearTimeout(lp)));
  box.addEventListener('scroll', () => clearTimeout(lp), {passive:true});
  box.addEventListener('contextmenu', e => e.preventDefault());
  box.addEventListener('click', e => {
    if (fired) { fired = false; return; }
    if (e.target.closest('#addDiner')) return dinerSheet();
    const c = e.target.closest('.chip[data-id]'); if (!c || c.dataset.id === S.active) return;
    S.active = c.dataset.id; save(); feedback('tick');
    $$('.chip[data-id]', box).forEach(x => { const on = x === c; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); });
    updateCounter();
  });
})();
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z' && !(e.target.closest && e.target.closest('input'))) { e.preventDefault(); undo(); } });
document.addEventListener('touchstart', () => {}, {passive:true});

/* =========================================================
   ARRANQUE
   ========================================================= */
applyLook();
ODO.ring = new Odo($('#ringN'));
$('#ringBar').style.strokeDasharray = RC;
$('#ringBar').style.strokeDashoffset = RC;
renderChips();
buildGrid();
let tickN = 0;
setInterval(() => {
  if (!S.session.start) return;
  updateTime();
  if (++tickN % 15 === 0) { S.diners.forEach(d => checkAll(d.id)); updateCounter(); }
}, 1000);
})();
</script>
<!--ARTIFACT-BODY-END-->
