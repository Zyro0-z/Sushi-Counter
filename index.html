<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sushi">
<meta name="description" content="Cuenta lo que comes en el buffet de sushi: coste real, misiones, desafíos, logros, duelos y ruleta.">
<meta name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="modulepreload" href="js/main.js">
<!--ARTIFACT-START-->
<title>Contador de Sushi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Shippori+Mincho:wght@700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
<!--ARTIFACT-HEAD-END-->
</head>
<body>
<!--ARTIFACT-BODY-START-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-bronze" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2B47C"/><stop offset="1" stop-color="#B0662F"/></linearGradient>
    <linearGradient id="g-silver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E4E9EF"/><stop offset="1" stop-color="#8592A3"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE07A"/><stop offset="1" stop-color="#E39A00"/></linearGradient>
    <linearGradient id="g-plat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7FD8E8"/><stop offset=".5" stop-color="#9B7BF5"/><stop offset="1" stop-color="#EE5FA8"/></linearGradient>
    <linearGradient id="g-accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:color-mix(in srgb,var(--accent) 62%,#fff)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
    <linearGradient id="g-goldring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD24A"/><stop offset=".5" stop-color="#FF9F0A"/><stop offset="1" stop-color="#FF5E3A"/></linearGradient>
    <linearGradient id="g-over" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF3B0"/><stop offset=".5" stop-color="#FFD24A"/><stop offset="1" stop-color="#FFB13A"/></linearGradient>
  </defs>
</svg>

<div class="app">
<div class="stage" id="stage">
  <div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

  <section class="view" id="v-count" aria-label="Contador">
    <header class="nav"><div class="nav-in">
      <div class="nav-l"><button class="gb ic glass" id="btnUndo" aria-label="Deshacer" disabled></button></div>
      <div class="nav-t">Contador</div>
      <div class="nav-r"><button class="gb ic glass" id="btnMore" aria-label="Juegos y herramientas: ruleta, duelo, contrarreloj, mesa compartida, ticket y guía" aria-haspopup="dialog" title="Juegos y herramientas"></button><button class="gb tint" id="btnFinish" disabled>Terminar</button></div>
    </div></header>
    <div class="content">
      <div><h1 class="lt">Contador</h1><button class="lt-sub bl" id="buffetLine" aria-label="Cambiar de buffet o de precio"></button></div>
      <div class="chips" id="chips" role="tablist" aria-label="Comensales"></div>
      <div class="hero card" id="hero"></div>
      <div class="bill card" id="bill"></div>
      <button class="mini-m card" id="miniM" aria-label="Ver misiones"></button>
      <section class="play" id="play" aria-label="Para jugar en la mesa"></section>
      <div class="pills" id="pills" aria-label="Categorías"></div>
      <div class="cats" id="cats"></div>
    </div>
  </section>

  <section class="view" id="v-ch" aria-label="Retos" hidden>
    <header class="nav"><div class="nav-in">
      <div class="nav-l"></div><div class="nav-t">Retos</div>
      <div class="nav-r"><button class="gb ic glass" id="btnNewCh" aria-label="Crear desafío"></button></div>
    </div></header>
    <div class="content" id="chBody"></div>
  </section>

  <section class="view" id="v-hist" aria-label="Historial" hidden>
    <header class="nav"><div class="nav-in"><div class="nav-l"></div><div class="nav-t">Historial</div><div class="nav-r"></div></div></header>
    <div class="content" id="histBody"></div>
  </section>

  <section class="view" id="v-set" aria-label="Ajustes" hidden>
    <header class="nav"><div class="nav-in"><div class="nav-l"><button class="gb glass back" id="setBack" hidden></button></div><div class="nav-t">Ajustes</div><div class="nav-r"></div></div></header>
    <div class="content" id="setBody"></div>
  </section>

  <nav class="tabbar glass" role="tablist" aria-label="Secciones">
    <span class="tb-pill" id="tbPill"></span>
    <button class="tb" data-tab="count" role="tab" aria-selected="true"></button>
    <button class="tb" data-tab="ch" role="tab" aria-selected="false"></button>
    <button class="tb" data-tab="hist" role="tab" aria-selected="false"></button>
    <button class="tb" data-tab="set" role="tab" aria-selected="false"></button>
  </nav>
</div>
</div>

<div class="trialbar glass" id="trialbar" role="status"></div>
<div class="snack glass" id="snack" role="status"></div>
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="banner" id="banner" role="status"></div>
<div class="hud glass" id="hud" role="status"></div>
<div class="sr" id="sr" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript><p style="padding:24px;font:17px system-ui">Esta app necesita JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
<!--ARTIFACT-BODY-END-->
</body>
</html>
